name: Test Progression Review
on:
  push:
    paths: ['admin/**','supabase/functions/progression-admin/**','tests/**','.github/workflows/test-progression-review.yml']
  pull_request:
    paths: ['admin/**','supabase/functions/progression-admin/**','tests/**','.github/workflows/test-progression-review.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/progression-admin.test.mjs

