name: Sync wger data

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 0'

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      WGER_BASE_URL: https://wger.de
      WGER_PAGE_SIZE: '100'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-wger.txt

      - name: Install sync dependencies
        run: pip install -r requirements-wger.txt

      - name: Check database secret
        shell: bash
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL GitHub Actions secret is missing."
            exit 1
          fi

      - name: Sync wger into Supabase
        run: python scripts/sync_wger.py
